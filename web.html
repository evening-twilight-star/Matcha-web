<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda - Matcha Travel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">
    <style>
            @media (max-width: 600px) {
        .hero-title { font-size: 32px; }
        .hero-logo { font-size: 40px; }
        .content { padding: 0 5%; margin-top: 100px; }
        .sidebar { width: 260px; }
        }
        :root {
            --matcha-dark: #2d4021;
            --matcha-main: #556b2f;
            --matcha-light: #a3b18a;
            --matcha-pale: #f0f2eb;
            --matcha-cream: #fefae0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Segoe UI', sans-serif; }

        body {
            /* GAMBAR WALLPAPER TEMA MACHA */
            background-image: 
                linear-gradient(rgba(240, 242, 235, 0.8), rgba(240, 242, 235, 0.9)),
                url('https://images.unsplash.com/photo-1596464716127-f2a82984de30?w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--matcha-dark);
        }
        html {
            scroll-behavior: smooth;
        }

        nav {
            background-color: var(--matcha-dark);
            height: 70px; /* Sedikit lebih tinggi */
            display: flex;
            align-items: center;
            padding: 0 5%;
            color: white;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 3px solid var(--matcha-main);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .hamburger-icon { font-size: 26px; cursor: pointer; margin-right: 20px; color: var(--matcha-light); transition: 0.3s; }
        .hamburger-icon:hover { color: white; }

        .logo { font-family: 'Satisfy', cursive; font-size: 32px; color: white; letter-spacing: 1px; flex-grow: 1; }
        .logo span { color: var(--matcha-main); }

        /* Sidebar - Transparan */
        .sidebar {
            position: fixed;
            top: 0;
            left: -300px; /* Lebih lebar */
            width: 300px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9); /* Sedikit transparan */
            backdrop-filter: blur(5px);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Animasi membal */
            z-index: 2000;
            padding-top: 90px;
            box-shadow: 5px 0 25px rgba(0,0,0,0.1);
            border-right: 2px solid var(--matcha-light);
        }

        .sidebar.active { left: 0; }

        .sidebar ul li a {
            display: block;
            color: var(--matcha-dark);
            padding: 18px 25px;
            text-decoration: none;
            transition: 0.3s;
            font-size: 16px;
            font-weight: 500;
            border-bottom: 1px solid rgba(163, 177, 138, 0.2);
        }

        .sidebar ul li a i { margin-right: 15px; width: 25px; color: var(--matcha-main); }

        .sidebar ul li a:hover {
            background-color: var(--matcha-main);
            color: white;
            padding-left: 35px;
        }

        .sidebar ul li a:hover i { color: var(--matcha-cream); }

        .overlay {
    position: fixed; /* Wajib fixed agar mengikuti layar */
    top: 0;          /* Mulai dari paling atas */
    left: 0;         /* Mulai dari paling kiri */
    width: 100vw;    /* Lebar 100% viewport (layar) */
    height: 100vh;   /* Tinggi 100% viewport (layar) */
    background: rgba(45, 64, 33, 0.6); /* Hijau matcha gelap transparan */
    backdrop-filter: blur(5px);       /* Efek blur profesional */
    -webkit-backdrop-filter: blur(5px);
    z-index: 1500;   /* Pastikan di atas konten & nav, tapi di bawah sidebar */
    
    /* Transisi agar halus */
    opacity: 0;
    visibility: hidden;
    transition: all 0.4s ease-in-out;
}

.overlay.active {
    opacity: 1;
    visibility: visible;
}
        .content { margin-top: 120px; text-align: center; color: var(--matcha-dark); padding: 0 10%; }
        
        .hero-title { font-size: 48px; color: var(--matcha-dark); margin-bottom: 15px; }
        .hero-logo { font-family: 'Satisfy', cursive; color: var(--matcha-main); font-size: 56px; display: inline; }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>
    <nav>
        <div class="hamburger-icon" id="open-btn"><i class="fas fa-bars"></i></div>
        <div class="logo">Matcha<span>Travel</span></div>
    </nav>

    <div class="sidebar" id="sidebar">
        <ul>
            <li><a href="isi.html"><i class="fas fa-ticket-alt"></i> Pesan Tiket Travel</a></li>
            <li><a href="#"><i class="fas fa-leaf"></i> Paket Wisata Kebun</a></li>
            <li><a href="#"><i class="fas fa-utensils"></i> Kuliner Matcha</a></li>
            <li><a href="login.html" style="color: #bc4749; border-top: 2px solid rgba(188, 71, 73, 0.1);"><i class="fas fa-sign-out-alt"></i> Keluar Portal</a></li>
        </ul>
    </div>

    <div class="content">
        <h1 class="hero-title">Selamat Datang di <div class="hero-logo">Matcha Travel</div></h1>
        <p style="font-size: 18px; color: var(--matcha-main); max-width: 600px; margin: auto;">Rasakan pengalaman perjalanan yang menenangkan dan menyegarkan. Silakan buka menu samping untuk mulai memesan perjalanan Anda.</p>
        
        <i class="fas fa-leaf" style="position: absolute; top: 150px; right: 10%; font-size: 80px; color: var(--matcha-main); opacity: 0.05;"></i>
        <i class="fas fa-leaf" style="position: absolute; bottom: 100px; left: 10%; font-size: 60px; color: var(--matcha-main); opacity: 0.05;"></i>
    </div>

    <script>
              // Tambahkan event listener di script
        document.querySelector('a[href="login.html"]').addEventListener('click', function(e) 
        {if(!confirm("Apakah Anda yakin ingin keluar?")) {e.preventDefault(); }})
        
        const openBtn = document.getElementById('open-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        openBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
    </script>
</body>
</html>
